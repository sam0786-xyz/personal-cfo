[project]
name = "personal-cfo"
version = "0.1.0"
description = "AgentCFO — an autonomous personal finance agent with Gmail bank reconciliation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.3",
    "google-cloud-firestore>=2.27.0",
    "google-genai>=2.6.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.48.0",
    "google-api-python-client>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "google-cloud-secret-manager>=2.0.0",
    "beautifulsoup4>=4.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B904", "B008", "E402"]

[tool.ruff.lint.per-file-ignores]
# Long lines here are LLM prompt text and keyword-rule data tables.
"app/agent.py" = ["E501"]
"app/classification.py" = ["E501"]
"app/routes/public.py" = ["E501"]
